<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clothing Brands — Shot by Wamz</title>
<meta name="description" content="Clothing brand shoots and lookbooks by Wamz, Lagos.">
<link rel="stylesheet" href="site.css">
<style>
.chap{padding:clamp(3rem,7vw,6rem) var(--pad) 0}
.chap h2{font-weight:500;font-size:clamp(1.8rem,4.4vw,3.6rem);letter-spacing:-.04em;line-height:1;margin-bottom:1.4rem}
.lk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lk .ph{aspect-ratio:4/5!important}
.lk .ph.l{grid-column:span 2;aspect-ratio:3/2!important}
.lk .ph .n,.lk .ph .c{position:absolute;left:.7rem;color:#fff;mix-blend-mode:difference;z-index:2;pointer-events:none}
.lk .ph .n{top:.55rem}.lk .ph .c{bottom:.55rem}
@media(max-width:700px){.lk{grid-template-columns:1fr 1fr}.lk .ph.l{grid-column:1/-1}}
.more{display:flex;justify-content:flex-end;align-items:center;margin-top:1.6rem;border-top:1px solid var(--fg);padding-top:.8rem}
.more a{font-family:"Plex Mono",monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;transition:color .3s}
.more a:hover{color:var(--accent)}
</style>
</head>
<body data-page="clothing">
<main>
  <section class="pg"><h1>Clothing Brands</h1></section>
  <div id="chapters"></div>
  <a class="next" href="events.html"><span>Next gallery</span>Events →</a>
</main>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
const n2 = n => String(n).padStart(2, '0');
document.getElementById('chapters').innerHTML = WAMZ.brands.map(b => {
  const shown = b.ids.slice(0, 6);
  return `<section class="chap" id="b${b.n}">
    <h2 data-reveal>Brand ${n2(b.n)}</h2>
    <div class="lk" data-set>${shown.map((id, i) => `<div class="ph ${P[id].w > P[id].h ? 'l' : ''}" data-lb="${id}" tabindex="0"><span class="n mono">${n2(i + 1)}</span><img src="${src(id)}" alt="${alt(id)}" loading="lazy" width="${P[id].w}" height="${P[id].h}"><span class="c mono">Look ${n2(i + 1)}</span></div>`).join('')}</div>
    <div class="more"><a href="brand.html?b=${b.n}">View full gallery →</a></div>
  </section>`; }).join('');
revealAll();
</script>
</body>
</html>
