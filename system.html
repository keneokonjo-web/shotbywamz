<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shot by Wamz — Concept 3 · System (black)</title>
<meta name="description" content="Shot by Wamz — fashion, portrait and nightlife photographer based in Lagos.">
<link rel="stylesheet" href="common.css">
<style>
@font-face{font-family:IT;src:url(fonts/intertight-300.woff2) format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:IT;src:url(fonts/intertight-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Mono;src:url(fonts/plexmono-400.woff2) format('woff2');font-weight:400;font-display:swap}
:root{--bg:#0b0b0b;--fg:#ededea;--line:#ffffff40;--accent:#d7ff3a;--ease:cubic-bezier(.22,1,.36,1)}
body{background:var(--bg);color:var(--fg);font-family:IT,Helvetica,Arial,sans-serif;font-weight:300;overflow-x:hidden}
.m{font-family:Mono,ui-monospace,monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase}
/* header */
.hd{position:fixed;inset:0 0 auto;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;padding:1rem 1.4rem;align-items:center;mix-blend-mode:difference;color:#fff}
.hd nav{display:flex;gap:1.6rem;justify-content:flex-end}
.hd a:hover{opacity:.6}
.hd .logo{font-weight:500;letter-spacing:.02em;font-size:1rem;text-transform:none}
@media(max-width:700px){.hd{grid-template-columns:1fr auto}.hd .c{display:none}.hd nav a:nth-child(n+3){display:none}}
/* hero */
.hero{position:relative;height:100vh;min-height:600px;overflow:hidden}
.sl{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.sl.on{opacity:1}
.sl img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;transform:scale(1.12);transition:transform 7s linear}
.sl.on img{transform:scale(1.02)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0006 0,#0000 30%,#000a 100%)}
.hero .meta{position:absolute;top:4.6rem;left:1.4rem;right:1.4rem;display:flex;justify-content:space-between;z-index:3}
.hero h1{position:absolute;left:1.4rem;bottom:5.2rem;z-index:3;font-weight:300;font-size:clamp(3.4rem,13vw,14rem);line-height:.82;letter-spacing:-.06em;overflow:hidden}
.hero h1 span{display:block;transform:translateY(105%);animation:rise 1.2s var(--ease) forwards}
.hero h1 span:nth-child(2){animation-delay:.12s;padding-left:.6em}
@keyframes rise{to{transform:none}}
.bars{position:absolute;left:1.4rem;right:1.4rem;bottom:1.6rem;display:flex;gap:6px;z-index:3}
.bars i{flex:1;height:2px;background:#fff4;position:relative;overflow:hidden}
.bars i b{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.bars i.done b{transform:none}
.bars i.on b{animation:fill 5.5s linear forwards}
@keyframes fill{to{transform:none}}
.cta{position:absolute;right:1.4rem;bottom:3.4rem;z-index:3;display:flex;gap:.8rem;align-items:center;padding:.9rem 1.5rem;border:1px solid #fff;border-radius:99px;transition:.3s;backdrop-filter:blur(8px)}
.cta:hover{background:var(--accent);color:#000;border-color:var(--accent)}
@media(max-width:700px){.hero h1 span:nth-child(2){padding-left:0}.cta{left:1.4rem;right:auto;bottom:4.6rem;padding:.7rem 1.2rem}.hero h1{bottom:8.2rem}}
/* sections */
section{padding:clamp(4rem,8vw,8rem) 1.4rem}
.head{display:grid;grid-template-columns:12rem 1fr;gap:2rem;border-top:1px solid var(--line);padding-top:1.2rem;margin-bottom:3rem}
.head h2{font-weight:300;font-size:clamp(2.2rem,6vw,6.4rem);line-height:.95;letter-spacing:-.05em;max-width:14ch}
.head h2 em{font-style:normal;color:var(--accent)}
@media(max-width:700px){.head{grid-template-columns:1fr;gap:1rem}}
/* pinned horizontal gallery */
.hs{height:380vh;position:relative}
.hs-in{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:center}
.track{display:flex;gap:1.2rem;padding:0 1.4rem;will-change:transform}
.fr{flex:0 0 auto;height:72vh;aspect-ratio:2/3;position:relative;overflow:hidden}
.fr.ls{aspect-ratio:3/2}
.fr img{width:100%;height:100%;object-fit:cover}
.fr .m{position:absolute;left:.8rem;bottom:.7rem;mix-blend-mode:difference;color:#fff}
.hs-top{position:absolute;top:5rem;left:1.4rem;right:1.4rem;display:flex;justify-content:space-between;z-index:2}
.prog{position:absolute;left:1.4rem;right:1.4rem;bottom:1.6rem;height:2px;background:#fff3}
.prog b{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(var(--p,0))}
@media(max-width:700px){.fr{height:62vh}}
/* system / services */
.sys{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.node{padding:1.6rem 1.4rem 4rem 0;border-right:1px solid var(--line);margin-right:1.4rem;transition:background .4s}
.node:last-child{border-right:0}
.node .n{font-size:clamp(3rem,8vw,7rem);letter-spacing:-.06em;line-height:1;color:var(--accent)}
.node h3{font-weight:500;font-size:1.4rem;letter-spacing:-.02em;margin:3rem 0 .7rem}
.node p{opacity:.7;max-width:22rem;line-height:1.45}
@media(max-width:800px){.sys{grid-template-columns:1fr}.node{border-right:0;border-bottom:1px solid var(--line);margin:0}}
/* wall */
.wgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:.5rem}
.wgrid figure{position:relative;overflow:hidden;grid-column:span 3;aspect-ratio:3/4;cursor:crosshair}
.wgrid figure:nth-child(1){grid-column:span 5;aspect-ratio:4/5}
.wgrid figure:nth-child(2){grid-column:span 4}
.wgrid figure:nth-child(5){grid-column:span 5}
.wgrid img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1);transition:filter .6s,transform 1.4s var(--ease)}
.wgrid figure:hover img{filter:none;transform:scale(1.05)}
.wgrid .m{position:absolute;left:.7rem;top:.6rem}
.wgrid .x{position:absolute;pointer-events:none;width:44px;height:44px;border:1px solid var(--accent);border-radius:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .2s}
.wgrid figure:hover .x{opacity:1}
.wlede{max-width:34rem;opacity:.75;font-size:1.3rem;line-height:1.4;margin-bottom:2.5rem}
@media(max-width:800px){.wgrid{grid-template-columns:1fr 1fr}.wgrid figure:nth-child(n){grid-column:span 1;aspect-ratio:3/4}}
/* book */
.book{display:grid;grid-template-columns:1fr 1.2fr;gap:4rem}
.tag{display:inline-block;margin-top:2rem;padding:.5rem .9rem;border:1px solid var(--accent);color:var(--accent);border-radius:99px}
.bk-submit{background:var(--accent);color:#000;border-color:var(--accent)}
.bk-submit:hover{background:transparent;color:var(--accent)}
.bk{--fg:var(--accent);--bg:#000}
@media(max-width:900px){.book{grid-template-columns:1fr;gap:2.5rem}}
footer{border-top:1px solid var(--line);padding:1.4rem 1.4rem 0;overflow:hidden}
.fr2{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1.4rem}
.giant{font-weight:300;font-size:25vw;line-height:.78;letter-spacing:-.07em;white-space:nowrap;margin:2.5rem 0 -3.2vw}
</style>
</head>
<body>
<header class="hd m">
  <a class="logo" href="#top" style="font-family:IT;letter-spacing:0;text-transform:none;font-size:1.05rem">Shot by Wamz</a>
  <span class="c" id="clock">Lagos —</span>
  <nav><a href="#work">Work</a><a href="#wall">Wall</a><a href="#system">Services</a><a href="#book">Book</a></nav>
</header>

<main>
<div class="hero" id="top">
  <div id="slides"></div>
  <div class="meta m"><span>6.5244° N, 3.3792° E</span><span id="cap">—</span></div>
  <h1><span>Shot by</span><span>Wamz</span></h1>
  <a class="cta m" href="#book">Book December <span>→</span></a>
  <div class="bars" id="bars" aria-hidden="true"></div>
</div>

<div class="hs" id="work">
  <div class="hs-in">
    <div class="hs-top m"><span>Selected work</span><span id="hsn">01 / 07</span></div>
    <div class="track" id="track"></div>
    <div class="prog"><b></b></div>
  </div>
</div>

<section id="wall">
  <div class="head"><span class="m">Personal project</span><h2 data-reveal>Wamz's <em>Wall</em></h2></div>
  <p class="wlede" id="wl" data-reveal></p>
  <div class="wgrid" id="wgrid"></div>
</section>

<section id="system">
  <div class="head"><span class="m">System</span><h2 data-reveal>What I <em>shoot</em></h2></div>
  <div class="sys" id="sys"></div>
</section>

<section id="book">
  <div class="book">
    <div>
      <div class="head" style="grid-template-columns:1fr;margin:0"><span class="m">Booking</span><h2 data-reveal>Book your <em>December</em></h2></div>
      <span class="tag m" id="avail"></span>
    </div>
    <div id="booking-form"></div>
  </div>
</section>
</main>

<footer>
  <div class="fr2 m"><span>Lagos, Nigeria</span><span id="wa"></span><span id="em"></span><span id="ig"></span></div>
  <div class="giant" aria-hidden="true">Wamz</div>
</footer>
<p class="m" style="padding:1rem 1.4rem;opacity:.45;background:#000">© <span data-year></span> Shot by Wamz · Concept 3 of 4 · placeholder contact details</p>

<script src="data.js"></script>
<script>
const W=WAMZ,P=W.photos,$=s=>document.querySelector(s);
/* hero slideshow with segmented progress */
const order=['night-flash','studio-trio','mono-portrait','stripes-duo','studio-solo'].map(W.photo);
$('#slides').innerHTML=order.map(p=>`<div class="sl"><img src="${p.src}" alt="${p.alt}"></div>`).join('');
$('#bars').innerHTML=order.map(()=>'<i><b></b></i>').join('');
const sl=[...document.querySelectorAll('.sl')],bars=[...document.querySelectorAll('#bars i')];let c=0;
function go(n){c=(n+order.length)%order.length;sl.forEach((s,i)=>s.classList.toggle('on',i===c));
  bars.forEach((b,i)=>{b.classList.remove('on');b.classList.toggle('done',i<c);if(i===c){void b.offsetWidth;b.classList.add('on')}});
  $('#cap').textContent=String(c+1).padStart(2,'0')+' / 0'+order.length+' — '+order[c].title}
bars.forEach((b,i)=>b.parentNode.addEventListener('click',()=>go(i)));
bars.forEach(b=>b.addEventListener('animationend',()=>go(c+1)));
go(0);
/* Lagos clock */
function clk(){$('#clock').textContent='Lagos '+new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Lagos',hour:'2-digit',minute:'2-digit'})}
clk();setInterval(clk,15000);
/* pinned horizontal gallery */
const g=[...P].sort((a,b)=>a.r>b.r?1:-1);
$('#track').innerHTML=P.map((p,i)=>`<figure class="fr ${p.r>1?'ls':''}"><img src="${p.src}" alt="${p.alt}" loading="lazy"><span class="m">${String(i+1).padStart(2,'0')} — ${p.title}</span></figure>`).join('');
const hs=$('#work'),track=$('#track'),prog=$('.prog');
function hscroll(){
  const r=hs.getBoundingClientRect(),max=hs.offsetHeight-innerHeight,p=Math.min(1,Math.max(0,-r.top/max));
  const dist=track.scrollWidth-innerWidth;
  track.style.transform=`translate3d(${-dist*p}px,0,0)`;prog.style.setProperty('--p',p);
  $('#hsn').textContent=String(Math.min(P.length,Math.floor(p*P.length)+1)).padStart(2,'0')+' / 0'+P.length;
}
addEventListener('scroll',hscroll,{passive:true});addEventListener('resize',hscroll);hscroll();
/* wall */
$('#wl').textContent=W.wall.blurb;
$('#wgrid').innerHTML=W.wall.ids.map((id,i)=>{const p=W.photo(id);return `<figure data-reveal style="--d:${i*.06}s"><img src="${p.s}" alt="${p.alt}" loading="lazy"><span class="m">W/${String(i+1).padStart(2,'0')}</span><i class="x"></i></figure>`}).join('');
document.querySelectorAll('.wgrid figure').forEach(f=>f.onmousemove=e=>{const b=f.getBoundingClientRect(),x=f.querySelector('.x');x.style.left=e.clientX-b.left+'px';x.style.top=e.clientY-b.top+'px'});
/* services */
$('#sys').innerHTML=W.services.map(s=>`<div class="node" data-reveal><div class="n">${s.n}</div><h3>${s.t}</h3><p>${s.d}</p></div>`).join('');
$('#avail').textContent=W.availability;
$('#wa').textContent=W.contact.whatsapp;$('#em').textContent=W.contact.email;$('#ig').textContent=W.contact.instagram;
</script>
<script src="common.js"></script>
</body>
</html>
