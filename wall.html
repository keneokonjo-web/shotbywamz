<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wamz's Wall — Shot by Wamz</title>
<meta name="description" content="Wamz's Wall — a personal portrait project by Wamz. Coming December 2026.">
<link rel="stylesheet" href="site.css">
<style>
.status{display:inline-block;background:var(--accent);color:#fff;padding:.5rem .8rem;margin-bottom:1.2rem}
.lede{max-width:44rem;font-size:clamp(1.3rem,2.6vw,2.2rem);line-height:1.2;letter-spacing:-.03em;font-weight:500}
.eds{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.4rem,4vw,3.4rem);padding:clamp(3rem,6vw,5rem) var(--pad) 0;max-width:62rem}
.print{display:block;padding:.7rem .7rem 0;background:#fff;border:1px solid #e6e6e6;box-shadow:0 14px 30px -18px #0003;transform:rotate(var(--r));transition:transform .6s var(--ease);position:relative}
.print:hover{transform:rotate(0) translateY(-6px)}
.print:before{content:"";position:absolute;left:50%;top:-11px;width:64px;height:20px;background:#f0e9d8cc;transform:translateX(-50%) rotate(-3deg);z-index:2}
.print .im{overflow:hidden;aspect-ratio:3/4;background:#f1f1f1}
.print img{width:100%;height:100%;object-fit:cover}
.print .cap{display:block;padding:.85rem 0 .9rem;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.print .cap b{font-weight:400;color:var(--mute)}
.print:hover .cap b{color:var(--accent)}
@media(max-width:700px){.eds{grid-template-columns:1fr;max-width:26rem;margin:0 auto}}
.notify{display:grid;grid-template-columns:1fr 1fr;gap:3rem;padding:clamp(3rem,6vw,5rem) var(--pad) 0}
.notify h2{font-weight:500;font-size:clamp(2rem,5vw,4.2rem);letter-spacing:-.045em;line-height:1}
.nf{display:flex;gap:.8rem;align-items:flex-end;flex-wrap:wrap}
.nf input{flex:1;min-width:14rem;font:inherit;border:0;border-bottom:1px solid var(--fg);padding:.7rem 0;background:transparent;border-radius:0}
.nf input:focus{outline:0;border-color:var(--accent)}
.nf button{padding:.9rem 1.4rem;background:var(--fg);color:#fff}
.nf button:hover{background:var(--accent)}
.nf+p{color:var(--mute);margin-top:.8rem;font-size:.85rem}
@media(max-width:800px){.notify{grid-template-columns:1fr;gap:1.4rem}}
</style>
</head>
<body data-page="wall">
<main>
  <section class="pg">
    <h1>Wamz's Wall</h1>
    <span class="status mono">Coming December 2026</span>
    <p class="lede">A personal project by Wamz — portraits, faces and Lagos nights made outside any brief, collected on one growing wall.</p>
  </section>
  <section class="eds" id="eds" aria-label="Editions"></section>
  <section class="notify">
    <h2 data-reveal>Be first to see the wall</h2>
    <div data-reveal>
      <form class="nf" id="nf"><input type="email" placeholder="Your email" aria-label="Email address"><button class="mono" type="submit">Notify me</button></form>
      <p id="nfn">Demo form: nothing is sent yet.</p>
    </div>
  </section>
  <a class="next" href="clothing.html"><span>Next gallery</span>Clothing Brands →</a>
</main>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
const rot = [-2.2, 1.8];
document.getElementById('eds').innerHTML = WAMZ.wall.map((w, i) => `<a class="print" style="--r:${rot[i % 2]}deg" href="wall-edition.html?ed=${w.n}" data-reveal>
  <div class="im"><img src="${src(w.cover)}" alt="${alt(w.cover)}" loading="lazy" width="${P[w.cover].w}" height="${P[w.cover].h}"></div>
  <span class="cap mono">Wamz's Wall Edition ${w.n} — <b>View gallery</b></span></a>`).join('');
document.getElementById('nf').addEventListener('submit', e => { e.preventDefault(); document.getElementById('nfn').textContent = 'Thank you — this is a demo form, nothing was sent.'; });
revealAll();
</script>
</body>
</html>
