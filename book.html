<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Book — Shot by Wamz</title>
<meta name="description" content="Book Wamz for a clothing, event or portrait shoot in Lagos. December 2026 dates are limited.">
<link rel="stylesheet" href="site.css">
<style>
.bkp{padding:7rem var(--pad) 0}
.bkp .lab{color:var(--mute);display:flex;gap:1rem;align-items:center}
.bkp .lab:before{content:"";width:28px;height:1px;background:var(--fg)}
.bkp h1{font-weight:500;font-size:clamp(2.6rem,7vw,6.4rem);line-height:.95;letter-spacing:-.05em;margin:1rem 0 1.4rem}
.status{display:inline-block;background:var(--accent);color:#fff;padding:.5rem .8rem}
.links{margin-top:clamp(2.5rem,6vw,4.5rem);max-width:56rem;border-top:1px solid var(--fg)}
.links a{display:grid;grid-template-columns:2.6rem 1fr auto;gap:1rem;align-items:center;padding:1.3rem 0;border-bottom:1px solid var(--fg);transition:padding .5s var(--ease),color .3s}
.links a:hover{padding-left:.8rem;color:var(--accent)}
.links svg{width:1.7rem;height:1.7rem;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.links b{font-weight:500;font-size:clamp(1.3rem,3.2vw,2.4rem);letter-spacing:-.035em;line-height:1.1;word-break:break-word}
.links small{display:block;margin-bottom:.25rem;color:var(--mute)}
.links .go{font-size:1.4rem}
</style>
</head>

<main>
  <section class="bkp">

        <span><small class="mono">Instagram</small><b>_sh0tbywamz</b></span><span class="go" aria-hidden="true">↗</span></a>
