<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shot by Wamz — Photographer, Lagos</title>
<meta name="description" content="Shot by Wamz — Lagos-based photographer. Clothing brands, events and personal work. Booking December 2026.">
<link rel="stylesheet" href="site.css">
<style>
/* ---------- hero (VIV-style): wordmark + continuous photo columns ---------- */
.top{position:relative}
.mark{position:absolute;left:11.7vw;top:25vh;z-index:0;font-weight:700;font-size:16vw;line-height:.74;letter-spacing:-.055em;white-space:nowrap;pointer-events:none}
.mark span{display:inline-block;transform:translateY(40%);opacity:0;animation:rise 1.2s var(--ease) .15s forwards}
@keyframes rise{to{transform:none;opacity:1}}
.tag{position:absolute;left:64vw;top:25vh;z-index:3;font-size:clamp(1rem,1.5vw,1.4rem);line-height:1.2;max-width:22vw;letter-spacing:-.01em}
.cols{position:relative;z-index:1;display:grid;grid-template-columns:11vw 25vw 25vw 25vw 11vw;justify-content:space-between;align-items:start;padding-bottom:6vw}
.col{display:flex;flex-direction:column;gap:.75vw}
.col:nth-child(1),.col:nth-child(5){margin-top:30vh}
.col:nth-child(2),.col:nth-child(4){margin-top:66vh}
.col:nth-child(3){margin-top:45.5vh;z-index:2}
.cell{position:relative;background:#f1f1f1;overflow:hidden;opacity:0;transform:translateY(30px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.cell.in{opacity:1;transform:none}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media(max-width:760px){
 .mark{left:4.5vw;top:25vh;font-size:30vw}
 .tag{left:4.5vw;top:15vh;max-width:70vw;font-size:1.05rem}
 .cols{grid-template-columns:1fr 1fr;justify-content:stretch;gap:2.6vw;padding:0 2.6vw 6vw}
 .col{gap:2.6vw}
 .col:nth-child(1){margin-top:calc(25vh + 22.5vw)}
 .col:nth-child(2){margin-top:calc(25vh + 22.5vw + 24vh)}
}
/* ---------- doors (Per Appelgren-style blank space) ---------- */
.doors{position:relative;height:100vh;min-height:620px;display:grid;place-items:center;overflow:hidden}
.names{position:relative;z-index:3;display:grid;gap:0;text-align:center;padding:.4rem .8rem;background:var(--bg)}
.names a{display:block;font-weight:500;font-size:clamp(1.15rem,2.4vw,2.2rem);line-height:1.18;letter-spacing:-.01em;text-transform:uppercase;transition:opacity .35s,color .35s}
.names a:hover,.names a:focus-visible{color:var(--accent)}
.names .ar{margin-left:.4em;width:.62em;height:.62em;animation:nudge 3.4s ease-in-out infinite}
.names a:nth-child(2) .ar{animation-delay:.5s}.names a:nth-child(3) .ar{animation-delay:1s}.names a:nth-child(4) .ar{animation-delay:1.5s}
@keyframes nudge{0%,55%,100%{transform:translate(0,0)}75%{transform:translate(4px,-4px)}}
.names.hov a:not(.on){opacity:.22}
.dimg{position:absolute;z-index:1;width:var(--w);aspect-ratio:3/4;left:var(--x);top:var(--y);overflow:hidden;background:#f1f1f1;animation:float 9s ease-in-out infinite;animation-delay:var(--dl,0s);transition:opacity .5s}
.dimg img{width:100%;height:100%;object-fit:cover}
.doors.hov .dimg:not(.on){opacity:.1}
@keyframes float{50%{transform:translateY(-8px)}}
/* 7 vertical photos, kept in a top band and a bottom band so they never touch the names */
.dimg:nth-of-type(1){--x:9%;--y:7%;--w:9vw}
.dimg:nth-of-type(2){--x:31%;--y:11%;--w:8vw;--dl:-2s}
.dimg:nth-of-type(3){--x:55%;--y:6%;--w:9vw;--dl:-4s}
.dimg:nth-of-type(4){--x:81%;--y:12%;--w:8vw;--dl:-6s}
.dimg:nth-of-type(5){--x:17%;--y:68%;--w:9vw;--dl:-3s}
.dimg:nth-of-type(6){--x:48%;--y:72%;--w:8vw;--dl:-5s}
.dimg:nth-of-type(7){--x:75%;--y:66%;--w:9vw;--dl:-1s}
.dimg:nth-of-type(n+8){display:block}
.dimg:nth-of-type(8){--x:2%;--y:38%;--w:7vw;--dl:-7s}
.dimg:nth-of-type(9){--x:90%;--y:44%;--w:7vw;--dl:-2s}
.dimg:nth-of-type(10){--x:25%;--y:40%;--w:6vw;--dl:-5s}
.dimg:nth-of-type(11){--x:68%;--y:38%;--w:6vw;--dl:-3s}
.dimg:nth-of-type(12){--x:35%;--y:80%;--w:6vw;--dl:-6s}
@media(max-width:760px){
 .dimg:nth-of-type(n+8){display:none}
 .doors{height:100svh;min-height:560px}
 .names a{font-size:1.2rem}
 .dimg:nth-of-type(1){--x:6%;--y:8%;--w:26vw}
 .dimg:nth-of-type(2){--x:36%;--y:21%;--w:24vw}
 .dimg:nth-of-type(3){--x:68%;--y:6%;--w:27vw}
 .dimg:nth-of-type(4){--x:7%;--y:67%;--w:25vw}
 .dimg:nth-of-type(5){--x:40%;--y:73%;--w:27vw}
 .dimg:nth-of-type(6){--x:71%;--y:63%;--w:24vw}
 .dimg:nth-of-type(7){--x:37%;--y:3%;--w:18vw}
}
</style>
</head>
<body data-page="home">
<main>
  <div class="top" id="top">
    <p class="tag">Photographer, Lagos.<br>Clothing brands, events &amp; personal work.</p>
    <h1 class="mark" aria-label="Wamz"><span>WAMZ</span></h1>
    <div class="cols" id="cols"></div>
  </div>

  <section class="doors" id="doors" aria-label="Galleries">
    <nav class="names" id="names">
      <a href="wall.html" data-cat="wall">Wamz's Wall<i class="ar arr" aria-hidden="true"></i></a>
      <a href="clothing.html" data-cat="clothing">Clothing Brands<i class="ar arr" aria-hidden="true"></i></a>
      <a href="events.html" data-cat="events">Events<i class="ar arr" aria-hidden="true"></i></a>
      <a href="campaigns.html" data-cat="campaigns">Campaigns<i class="ar arr" aria-hidden="true"></i></a>
    </nav>
  </section>
</main>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
/* ---- hero: 7 photos, no repeats ---- */
const H = WAMZ.hero;                                   // order as chosen
const mq = matchMedia('(max-width:760px)');
const colsEl = document.getElementById('cols');
const cell = id => `<div class="cell" style="aspect-ratio:${P[id].w}/${P[id].h}" data-lb="${id}"><img src="${thumb(id)}" alt="${alt(id)}" width="${P[id].w}" height="${P[id].h}"></div>`;
function build(){
  let cols;
  if (mq.matches) cols = [[H[0], H[2], H[4], H[6]], [H[1], H[3], H[5]]];       // mobile: two columns, right one sits lower
  else cols = WAMZ.heroDesk;                                                    // desktop: five columns, longer so they fill the taller canvas
  colsEl.innerHTML = cols.map(c => `<div class="col" data-set>${c.map(cell).join('')}</div>`).join('');
  requestAnimationFrame(() => colsEl.querySelectorAll('.cell').forEach((c, i) => setTimeout(() => c.classList.add('in'), 70 * i)));
}
mq.addEventListener('change', build); build();

/* ---- the "doors": 7 vertical photos around three gallery names ---- */
const doors = document.getElementById('doors'), names = document.getElementById('names');
const page = c => c + '.html';
names.insertAdjacentHTML('beforebegin', [...WAMZ.doors, ...WAMZ.doorsDesk].map(([id, cat]) => `<a class="dimg" href="${page(cat)}" data-cat="${cat}" tabindex="-1" aria-hidden="true"><img src="${thumb(id)}" alt="" loading="lazy"></a>`).join(''));
const hov = cat => { doors.classList.toggle('hov', !!cat); names.classList.toggle('hov', !!cat);
  doors.querySelectorAll('[data-cat]').forEach(el => el.classList.toggle('on', el.dataset.cat === cat)); };
names.querySelectorAll('a').forEach(a => { a.addEventListener('mouseenter', () => hov(a.dataset.cat)); a.addEventListener('focus', () => hov(a.dataset.cat));
  a.addEventListener('mouseleave', () => hov()); a.addEventListener('blur', () => hov()); });
</script>
</body>
</html>
