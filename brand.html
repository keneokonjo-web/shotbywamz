<!doctype html>
<html lang="en">
<head>

<title>Brand gallery — Shot by Wamz</title>
<link rel="stylesheet" href="site.css">
<style>
.mas{columns:3;column-gap:6px;padding:2rem var(--pad) 0}
.mas .ph{break-inside:avoid;margin-bottom:6px}

</style>
</head>
<body data-page="clothing">
<main>
  <section class="pg"><h1 id="t">Brand</h1></section>
  <div class="mas" id="mas" data-set></div>
  <a class="next" href="clothing.html"><span>Back</span>← Clothing Brands</a>
</main>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
const b = WAMZ.brands.find(x => x.n === +new URLSearchParams(location.search).get('b')) || WAMZ.brands[0];
const t = b.name;
document.getElementById('t').textContent = t; document.title = t + ' — Shot by Wamz';
document.getElementById('mas').innerHTML = b.ids.map(id => fig(id)).join('');
</script>
</body>
