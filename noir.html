<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shot by Wamz — Concept 4 · Noir (black)</title>
<meta name="description" content="Shot by Wamz — fashion, portrait and nightlife photographer based in Lagos.">
<link rel="stylesheet" href="common.css">
<style>
@font-face{font-family:IS;src:url(fonts/instrumentserif-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:IS;src:url(fonts/instrumentserif-400i.woff2) format('woff2');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:IT;src:url(fonts/intertight-500.woff2) format('woff2');font-weight:500;font-display:swap}
:root{--bg:#050505;--fg:#f2efe8;--line:#ffffff33;--accent:#e8c27a;--ease:cubic-bezier(.22,1,.36,1)}
body{background:var(--bg);color:var(--fg);font-family:IT,Helvetica,Arial,sans-serif;font-weight:500;overflow-x:hidden}
.s{font-family:IS,Georgia,serif;font-weight:400}
.lab{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}
/* header */
.hd{position:fixed;inset:0 0 auto;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.5rem;mix-blend-mode:difference;color:#fff}
.hd nav{display:flex;gap:1.8rem}.hd a:hover{font-style:italic}
.hd .lg{font-family:IS,serif;font-size:1.5rem;letter-spacing:0;text-transform:none}
@media(max-width:700px){.hd nav a:nth-child(-n+2){display:none}}
/* hero: cursor image trail */
.hero{position:relative;height:100vh;min-height:600px;overflow:hidden;display:grid;place-items:center;cursor:crosshair}
.hero h1{position:relative;z-index:5;text-align:center;font-size:clamp(4.5rem,19vw,22rem);line-height:.82;letter-spacing:-.04em;pointer-events:none;mix-blend-mode:difference;color:#fff}
.hero h1 i{display:block}
.hero h1 .l{display:block;overflow:hidden;padding:.04em .1em}
.hero h1 .l>span{display:block;transform:translateY(105%);animation:rise 1.3s var(--ease) forwards}
.hero h1 .l:nth-child(2)>span{animation-delay:.14s}
@keyframes rise{to{transform:none}}
.trail{position:absolute;width:clamp(120px,15vw,230px);aspect-ratio:3/4;pointer-events:none;transform:translate(-50%,-50%) scale(.6) rotate(var(--r));opacity:0;z-index:2;object-fit:cover;animation:tr 1.6s var(--ease) forwards}
@keyframes tr{15%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(var(--r))}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.92) rotate(var(--r))}}
.hint{position:absolute;bottom:1.6rem;z-index:5;display:flex;width:100%;justify-content:space-between;padding:0 1.5rem}
.mq{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:1.1rem 0}
.mq div{display:inline-block;animation:mq 30s linear infinite;font-family:IS,serif;font-size:clamp(1.6rem,3.4vw,3.4rem)}
.mq span{padding:0 1.5rem}.mq em{color:var(--accent)}
@keyframes mq{to{transform:translateX(-50%)}}
/* generic */
section{padding:clamp(4rem,9vw,9rem) 1.5rem}
h2{font-family:IS,serif;font-weight:400;font-size:clamp(3rem,9vw,10rem);line-height:.88;letter-spacing:-.03em}
h2 em{color:var(--accent)}
/* index */
.list{margin-top:3rem;border-top:1px solid var(--line)}
.it{display:grid;grid-template-columns:4rem 1fr auto;gap:1rem;align-items:baseline;padding:1.1rem 0;border-bottom:1px solid var(--line);position:relative;transition:padding .5s var(--ease)}
.it:hover{padding-left:1.4rem;color:var(--accent)}
.it h3{font-family:IS,serif;font-weight:400;font-size:clamp(2.2rem,6vw,6.5rem);line-height:1;letter-spacing:-.025em}
.it h3 i{font-style:italic}
.it img{position:absolute;right:14%;top:50%;width:clamp(110px,14vw,210px);aspect-ratio:3/4;object-fit:cover;transform:translateY(-50%) scale(.85) rotate(4deg);opacity:0;transition:.5s var(--ease);pointer-events:none;z-index:3}
.it:hover img{opacity:1;transform:translateY(-50%) scale(1) rotate(-3deg)}
@media(hover:none){.it img{display:none}}
@media(max-width:700px){.it{grid-template-columns:2.5rem 1fr}.it .lab:last-child{display:none}}
/* wall collage */
.collage{position:relative;height:150vh;margin-top:3rem}
.collage figure{position:absolute;width:var(--w);left:var(--x);top:var(--y);will-change:transform;box-shadow:0 20px 60px #000a}
.collage img{width:100%;aspect-ratio:var(--ar,3/4);object-fit:cover}
.collage figcaption{margin-top:.5rem}
.wnote{position:absolute;left:var(--x);top:var(--y);max-width:20rem;font-family:IS,serif;font-size:1.7rem;line-height:1.15;font-style:italic;z-index:3}
@media(max-width:800px){.collage{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:.8rem}.collage figure{position:static;width:auto;transform:none!important}.wnote{position:static;grid-column:1/-1}}
/* book */
.book{display:grid;grid-template-columns:1fr 1.2fr;gap:4rem;align-items:start}
.book h2{margin-bottom:1.5rem}
.av{font-family:IS,serif;font-style:italic;font-size:1.6rem;color:var(--accent)}
.bk-submit{background:var(--fg);color:#000;border-color:var(--fg)}
.bk-submit:hover{background:transparent;color:var(--fg)}
.bk{--fg:var(--accent);--bg:#000}
@media(max-width:900px){.book{grid-template-columns:1fr;gap:2.5rem}}
footer{padding:2rem 1.5rem 0;border-top:1px solid var(--line);overflow:hidden}
.fr2{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1.4rem}
.giant{font-family:IS,serif;font-style:italic;font-size:26vw;line-height:.78;letter-spacing:-.04em;white-space:nowrap;margin:2rem 0 -3.4vw;text-align:center}
</style>
</head>
<body>
<header class="hd lab">
  <a class="lg" href="#top">Shot by Wamz</a>
  <nav><a href="#work">Work</a><a href="#wall">Wall</a><a href="#book">Book</a></nav>
</header>

<main>
<div class="hero" id="top">
  <h1 class="s" aria-label="Shot by Wamz"><span class="l"><span>Shot by</span></span><span class="l"><span><i style="font-style:italic">Wamz</i></span></span></h1>
  <div class="hint lab"><span>Lagos, Nigeria</span><span id="hint">Move your cursor</span><span>Fashion · Portrait · Night</span></div>
</div>

<div class="mq" aria-hidden="true"><div id="mq"></div></div>

<section id="work">
  <div class="lab" data-reveal>Selected work</div>
  <h2 data-reveal>A face, a frame,<br><em>a night</em> in Lagos</h2>
  <div class="list" id="list"></div>
</section>

<section id="wall">
  <div class="lab" data-reveal>Personal project</div>
  <h2 data-reveal>Wamz's <em>Wall</em></h2>
  <div class="collage" id="collage"></div>
</section>

<section id="book">
  <div class="book">
    <div>
      <div class="lab" data-reveal>Booking</div>
      <h2 data-reveal>Book your <em>December</em></h2>
      <p class="av" id="avail"></p>
    </div>
    <div id="booking-form"></div>
  </div>
</section>
</main>

<footer>
  <div class="fr2 lab"><span>Lagos, Nigeria</span><span id="wa"></span><span id="em"></span><span id="ig"></span></div>
  <div class="giant" aria-hidden="true">Wamz</div>
</footer>
<p class="lab" style="padding:1rem 1.5rem;opacity:.45">© <span data-year></span> Shot by Wamz · Concept 4 of 4 · placeholder contact details</p>

<script src="data.js"></script>
<script>
const W=WAMZ,P=W.photos,$=s=>document.querySelector(s);
/* hero trail: images spawn along the cursor path; auto-play on touch / idle */
const hero=$('#top');let last={x:0,y:0},n=0,idle;
function spawn(x,y){
  const p=P[n++%P.length],im=new Image();im.src=p.s;im.alt='';im.className='trail';
  im.style.left=x+'px';im.style.top=y+'px';im.style.setProperty('--r',(Math.random()*12-6)+'deg');
  hero.appendChild(im);setTimeout(()=>im.remove(),1700)}
hero.addEventListener('pointermove',e=>{
  const r=hero.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(Math.hypot(x-last.x,y-last.y)>110){last={x,y};spawn(x,y);$('#hint').textContent='';}
  clearTimeout(idle);});
let auto=0;
setInterval(()=>{if(matchMedia('(hover:none)').matches||!n){const r=hero.getBoundingClientRect();
  spawn(r.width*(.2+Math.random()*.6),r.height*(.25+Math.random()*.5))}},1100);
/* marquee */
const words=['Clothing brands','Portraits','Nightlife','Lagos','Editorial','Wamz’s Wall'];
const run=words.map(w=>`<span>${w}</span><span><em>✦</em></span>`).join('');
$('#mq').innerHTML=run+run+run+run;
/* index list */
$('#list').innerHTML=P.map((p,i)=>`<a class="it" href="${p.src}" data-reveal><span class="lab">${String(i+1).padStart(2,'0')}</span><h3>${p.title.split(' ').slice(0,-1).join(' ')} <i>${p.title.split(' ').slice(-1)}</i></h3><span class="lab">${p.cat}</span><img src="${p.s}" alt="${p.alt}" loading="lazy"></a>`).join('');
/* wall collage with parallax */
const pos=[['0%','0%','24vw',1.2],['30%','14%','20vw',1.6],['58%','4%','26vw',1.0],['10%','46%','22vw',1.4],['44%','52%','28vw',.8],['78%','40%','18vw',1.8]];
const wc=$('#collage');
wc.innerHTML=`<p class="wnote" style="--x:68%;--y:60%" data-reveal>${W.wall.blurb}</p>`+W.wall.ids.map((id,i)=>{const p=W.photo(id),q=pos[i];
 return `<figure data-sp="${q[3]}" style="--x:${q[0]};--y:${q[1]};--w:${q[2]};--ar:${p.r>1?'3/2':'3/4'}"><img src="${p.s}" alt="${p.alt}" loading="lazy"><figcaption class="lab">W/${String(i+1).padStart(2,'0')}</figcaption></figure>`}).join('');
const figs=[...wc.querySelectorAll('figure')];
function par(){const b=wc.getBoundingClientRect(),mid=b.top+b.height/2-innerHeight/2;
  if(matchMedia('(max-width:800px)').matches)return;
  figs.forEach(f=>f.style.transform=`translateY(${mid*(f.dataset.sp-1)*.22}px)`)}
addEventListener('scroll',par,{passive:true});par();
$('#avail').textContent=W.availability;
$('#wa').textContent=W.contact.whatsapp;$('#em').textContent=W.contact.email;$('#ig').textContent=W.contact.instagram;
</script>
<script src="common.js"></script>
</body>
</html>
